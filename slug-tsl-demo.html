<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slug Font Rendering — Three.js TSL</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0d0d1a; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; }
    #info {
        position: absolute; top: 12px; left: 12px;
        color: #bbb; font-size: 13px; line-height: 1.6;
        background: rgba(0,0,0,0.65); padding: 12px 16px;
        border-radius: 8px; max-width: 480px;
        backdrop-filter: blur(8px);
    }
    #info strong { color: #fff; font-size: 14px; }
    #info a { color: #6ac4ff; text-decoration: none; }
    #info a:hover { text-decoration: underline; }
    .label {
        position: absolute; color: #aaa; font-size: 11px; font-weight: 600;
        text-align: center; width: 100px; pointer-events: none;
        letter-spacing: 0.05em; text-transform: uppercase;
    }
    #error {
        display: none; position: absolute; inset: 0;
        background: #0d0d1a; color: #e44; font-size: 18px;
        display: none; align-items: center; justify-content: center;
        text-align: center; padding: 40px;
    }
</style>
</head>
<body>
<div id="info">
    <strong>Slug Font Rendering</strong> — Three.js TSL Implementation<br>
    GPU ray-casting against quadratic B&eacute;zier curves<br>
    <a href="https://jcgt.org/published/0006/02/02/" target="_blank">JCGT 2017 Paper</a> &bull;
    <a href="https://terathon.com/blog/decade-slug.html" target="_blank">Decade of Slug</a><br>
    Scroll to zoom &middot; Drag to pan &middot; Resolution-independent at any scale
</div>
<div id="error">
    <div>WebGPU / WebGL2 is required.<br>Please use a modern browser.</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import {
    Fn, uniform, vec2, vec4, float, int, uint,
    ivec2,
    textureLoad, uv,
    Loop, If, Break,
    abs, sqrt, max, min, fwidth, saturate
} from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


// =====================================================================
//  Slug Algorithm — Three.js Shading Language (TSL) Implementation
//  Reference: Eric Lengyel, "GPU-Centered Font Rendering Directly
//  from Glyph Outlines", JCGT 2017. Original shaders under MIT License.
// =====================================================================


// ------------------------------------------------------------------
//  CalcRootCode — determine which quadratic roots contribute to the
//  winding number based on the sign pattern of y1, y2, y3.
//  A 16-bit lookup table (0x2E74) encodes eligibility for 8 sign
//  combinations. Bits 0 and 8 of the shifted result indicate which
//  of the two roots should be counted.
// ------------------------------------------------------------------
const calcRootCode = Fn( ( [ y1, y2, y3 ] ) => {

    const s1 = uint( 0 ).toVar();
    const s2 = uint( 0 ).toVar();
    const s3 = uint( 0 ).toVar();
    If( y1.lessThan( 0.0 ), () => { s1.assign( uint( 1 ) ); } );
    If( y2.lessThan( 0.0 ), () => { s2.assign( uint( 1 ) ); } );
    If( y3.lessThan( 0.0 ), () => { s3.assign( uint( 1 ) ); } );

    const shift = s1.bitOr( s2.shiftLeft( uint( 1 ) ) )
                    .bitOr( s3.shiftLeft( uint( 2 ) ) );

    return uint( 0x2E74 ).shiftRight( shift ).bitAnd( uint( 0x0101 ) );

} );


// ------------------------------------------------------------------
//  SolveHorizPoly — find x-coordinates where the sample-relative
//  quadratic Bezier curve C(t) crosses y = 0.
//  p12 = (p1.x, p1.y, p2.x, p2.y), p3 = (p3.x, p3.y).
// ------------------------------------------------------------------
const solveHorizPoly = Fn( ( [ p12, p3 ] ) => {

    const ax = p12.x.sub( p12.z.mul( 2.0 ) ).add( p3.x );
    const ay = p12.y.sub( p12.w.mul( 2.0 ) ).add( p3.y );
    const bx = p12.x.sub( p12.z );
    const by = p12.y.sub( p12.w );

    const ra = float( 1.0 ).div( ay );
    const rb = float( 0.5 ).div( by );
    const disc = sqrt( max( by.mul( by ).sub( ay.mul( p12.y ) ), 0.0 ) );

    const t1 = by.sub( disc ).mul( ra ).toVar();
    const t2 = by.add( disc ).mul( ra ).toVar();

    // Nearly-linear fallback: solve  -2b·t + c = 0
    If( abs( ay ).lessThan( 1.0 / 65536.0 ), () => {
        const lt = p12.y.mul( rb );
        t1.assign( lt );
        t2.assign( lt );
    } );

    return vec2(
        ax.mul( t1 ).sub( bx.mul( 2.0 ) ).mul( t1 ).add( p12.x ),
        ax.mul( t2 ).sub( bx.mul( 2.0 ) ).mul( t2 ).add( p12.x )
    );

} );


// ------------------------------------------------------------------
//  SolveVertPoly — find y-coordinates where the curve crosses x = 0.
// ------------------------------------------------------------------
const solveVertPoly = Fn( ( [ p12, p3 ] ) => {

    const ax = p12.x.sub( p12.z.mul( 2.0 ) ).add( p3.x );
    const ay = p12.y.sub( p12.w.mul( 2.0 ) ).add( p3.y );
    const bx = p12.x.sub( p12.z );
    const by = p12.y.sub( p12.w );

    const ra = float( 1.0 ).div( ax );
    const rb = float( 0.5 ).div( bx );
    const disc = sqrt( max( bx.mul( bx ).sub( ax.mul( p12.x ) ), 0.0 ) );

    const t1 = bx.sub( disc ).mul( ra ).toVar();
    const t2 = bx.add( disc ).mul( ra ).toVar();

    If( abs( ax ).lessThan( 1.0 / 65536.0 ), () => {
        const lt = p12.x.mul( rb );
        t1.assign( lt );
        t2.assign( lt );
    } );

    return vec2(
        ay.mul( t1 ).sub( by.mul( 2.0 ) ).mul( t1 ).add( p12.y ),
        ay.mul( t2 ).sub( by.mul( 2.0 ) ).mul( t2 ).add( p12.y )
    );

} );


// ------------------------------------------------------------------
//  CalcCoverage — combine horizontal and vertical ray results with
//  weighted blending for robust anti-aliasing.
// ------------------------------------------------------------------
const calcCoverage = Fn( ( [ xcov, ycov, xwgt, ywgt ] ) => {

    const wt = max( xwgt.add( ywgt ), float( 1.0 / 65536.0 ) );
    const cov = max(
        abs( xcov.mul( xwgt ).add( ycov.mul( ywgt ) ) ).div( wt ),
        min( abs( xcov ), abs( ycov ) )
    );
    return saturate( cov );

} );


// ------------------------------------------------------------------
//  buildSlugMaterial — create a NodeMaterial whose fragment shader
//  implements the full Slug rendering pipeline.
//
//  curveTex / bandTex : shared DataTextures (RGBA32F, NearestFilter)
//  glyphDataVal       : [glyphLocX, glyphLocY, bandMaxX, bandMaxY]
//  bandTransformVal   : [scaleX, scaleY, offsetX, offsetY]
//  colorVal           : [r, g, b]
// ------------------------------------------------------------------
function buildSlugMaterial( curveTex, bandTex, glyphDataVal, bandTransformVal, colorVal ) {

    const uGlyphData     = uniform( new THREE.Vector4( ...glyphDataVal ) );
    const uBandTransform = uniform( new THREE.Vector4( ...bandTransformVal ) );
    const uColor         = uniform( new THREE.Vector3( ...colorVal ) );

    // Build fragment node graph ----------------------------------------
    const fragmentOutput = Fn( () => {

        // Em-space sample coordinate (UV of the quad)
        const rc = uv();

        // Pixel ↔ em-space conversion via screen-space derivatives
        const pixPerEm = vec2( 1.0 ).div( fwidth( rc ) );

        // Unpack glyph metadata
        const gx  = uGlyphData.x.toInt();
        const gy  = uGlyphData.y.toInt();
        const bmx = uGlyphData.z.toInt();
        const bmy = uGlyphData.w.toInt().bitAnd( int( 0xFF ) );

        // Map render coordinate to band index, clamped to valid range
        const biRaw = rc.mul( uBandTransform.xy ).add( uBandTransform.zw );
        const bix   = int( 0 ).toVar();
        const biy   = int( 0 ).toVar();
        bix.assign( max( min( biRaw.x.toInt(), bmx ), int( 0 ) ) );
        biy.assign( max( min( biRaw.y.toInt(), bmy ), int( 0 ) ) );

        // ============================================================
        //  Horizontal band — cast a ray in +x, count winding crossings
        // ============================================================
        const xcov = float( 0.0 ).toVar();
        const xwgt = float( 0.0 ).toVar();

        const hHdr    = textureLoad( bandTex, ivec2( gx.add( biy ), gy ), int( 0 ) );
        const hCount  = hHdr.x.toInt();
        const hOff    = hHdr.y.toInt();

        Loop( { start: int( 0 ), end: hCount, type: 'int', condition: '<' }, ( { i } ) => {

            const ref = textureLoad( bandTex, ivec2( gx.add( hOff ).add( i ), gy ), int( 0 ) );
            const cLoc = ivec2( ref.x.toInt(), ref.y.toInt() );

            // Fetch quadratic Bezier control points and make sample-relative
            const raw12 = textureLoad( curveTex, cLoc, int( 0 ) );
            const raw3  = textureLoad( curveTex, ivec2( cLoc.x.add( int( 1 ) ), cLoc.y ), int( 0 ) );

            const p12 = vec4(
                raw12.x.sub( rc.x ), raw12.y.sub( rc.y ),
                raw12.z.sub( rc.x ), raw12.w.sub( rc.y )
            );
            const p3 = vec2( raw3.x.sub( rc.x ), raw3.y.sub( rc.y ) );

            // Early exit — curves are sorted by descending max-x
            If( max( max( p12.x, p12.z ), p3.x ).mul( pixPerEm.x ).lessThan( - 0.5 ), () => {
                Break();
            } );

            const code = calcRootCode( p12.y, p12.w, p3.y );

            If( code.notEqual( uint( 0 ) ), () => {

                const r = solveHorizPoly( p12, p3 ).mul( pixPerEm.x );

                If( code.bitAnd( uint( 1 ) ).notEqual( uint( 0 ) ), () => {
                    xcov.addAssign( saturate( r.x.add( 0.5 ) ) );
                    xwgt.assign( max( xwgt, saturate( float( 1.0 ).sub( abs( r.x ).mul( 2.0 ) ) ) ) );
                } );

                If( code.greaterThan( uint( 1 ) ), () => {
                    xcov.subAssign( saturate( r.y.add( 0.5 ) ) );
                    xwgt.assign( max( xwgt, saturate( float( 1.0 ).sub( abs( r.y ).mul( 2.0 ) ) ) ) );
                } );

            } );

        } );

        // ============================================================
        //  Vertical band — cast a ray in +y, count winding crossings
        // ============================================================
        const ycov = float( 0.0 ).toVar();
        const ywgt = float( 0.0 ).toVar();

        const vHdr   = textureLoad( bandTex, ivec2( gx.add( bmy ).add( int( 1 ) ).add( bix ), gy ), int( 0 ) );
        const vCount = vHdr.x.toInt();
        const vOff   = vHdr.y.toInt();

        Loop( { start: int( 0 ), end: vCount, type: 'int', condition: '<' }, ( { i } ) => {

            const ref = textureLoad( bandTex, ivec2( gx.add( vOff ).add( i ), gy ), int( 0 ) );
            const cLoc = ivec2( ref.x.toInt(), ref.y.toInt() );

            const raw12 = textureLoad( curveTex, cLoc, int( 0 ) );
            const raw3  = textureLoad( curveTex, ivec2( cLoc.x.add( int( 1 ) ), cLoc.y ), int( 0 ) );

            const p12 = vec4(
                raw12.x.sub( rc.x ), raw12.y.sub( rc.y ),
                raw12.z.sub( rc.x ), raw12.w.sub( rc.y )
            );
            const p3 = vec2( raw3.x.sub( rc.x ), raw3.y.sub( rc.y ) );

            If( max( max( p12.y, p12.w ), p3.y ).mul( pixPerEm.y ).lessThan( - 0.5 ), () => {
                Break();
            } );

            const code = calcRootCode( p12.x, p12.z, p3.x );

            If( code.notEqual( uint( 0 ) ), () => {

                const r = solveVertPoly( p12, p3 ).mul( pixPerEm.y );

                If( code.bitAnd( uint( 1 ) ).notEqual( uint( 0 ) ), () => {
                    ycov.subAssign( saturate( r.x.add( 0.5 ) ) );
                    ywgt.assign( max( ywgt, saturate( float( 1.0 ).sub( abs( r.x ).mul( 2.0 ) ) ) ) );
                } );

                If( code.greaterThan( uint( 1 ) ), () => {
                    ycov.addAssign( saturate( r.y.add( 0.5 ) ) );
                    ywgt.assign( max( ywgt, saturate( float( 1.0 ).sub( abs( r.y ).mul( 2.0 ) ) ) ) );
                } );

            } );

        } );

        // Final coverage
        const coverage = calcCoverage( xcov, ycov, xwgt, ywgt );
        return vec4( uColor.x.mul( coverage ), uColor.y.mul( coverage ), uColor.z.mul( coverage ), coverage );

    } )();

    const material = new THREE.NodeMaterial();
    material.fragmentNode = fragmentOutput;
    material.transparent   = true;
    material.depthWrite    = false;
    material.blending      = THREE.CustomBlending;
    material.blendSrc      = THREE.OneFactor;              // premultiplied alpha
    material.blendDst      = THREE.OneMinusSrcAlphaFactor;
    material.side          = THREE.DoubleSide;

    return material;
}


// =====================================================================
//  Glyph Contour Generators
// =====================================================================

/** Generate quadratic Bezier arcs approximating a circle. */
function circleContour( cx, cy, r, n = 8, cw = false ) {

    const curves = [];
    const dt = ( 2 * Math.PI ) / n;
    const cs = r / Math.cos( dt / 2 );           // control-point radius

    for ( let k = 0; k < n; k ++ ) {

        const t1 = k * dt, t2 = ( k + 1 ) * dt, tm = ( t1 + t2 ) / 2;
        const pA = [ cx + r  * Math.cos( t1 ), cy + r  * Math.sin( t1 ) ];
        const pB = [ cx + r  * Math.cos( t2 ), cy + r  * Math.sin( t2 ) ];
        const pC = [ cx + cs * Math.cos( tm ), cy + cs * Math.sin( tm ) ];

        curves.push( cw ? { p1: pB, p2: pC, p3: pA } : { p1: pA, p2: pC, p3: pB } );

    }

    return curves;

}

/** Generate degenerate-quadratic straight edges for a polygon. */
function polygonContour( verts ) {

    return verts.map( ( v, i ) => {

        const w = verts[ ( i + 1 ) % verts.length ];
        return {
            p1: [ v[ 0 ], v[ 1 ] ],
            p2: [ ( v[ 0 ] + w[ 0 ] ) / 2, ( v[ 1 ] + w[ 1 ] ) / 2 ],
            p3: [ w[ 0 ], w[ 1 ] ]
        };

    } );

}

/** 5-pointed star contour. */
function starContour( cx, cy, rO, rI, pts = 5 ) {

    const verts = [];

    for ( let i = 0; i < pts * 2; i ++ ) {

        const a = ( i * Math.PI ) / pts - Math.PI / 2;
        const r = i % 2 === 0 ? rO : rI;
        verts.push( [ cx + r * Math.cos( a ), cy + r * Math.sin( a ) ] );

    }

    return polygonContour( verts );

}

/** Heart-like shape using quadratic Bezier curves. */
function heartContour( cx, cy, s ) {

    // A stylised heart: two arcs at the top, two edges meeting at the bottom.
    const curves = [];
    const top = cy + 0.30 * s;
    const bot = cy - 0.48 * s;
    const mid = cy + 0.08 * s;
    const w   = 0.42 * s;

    // Left lobe (CCW)
    curves.push( { p1: [ cx, top ],       p2: [ cx - w * 0.55, top + 0.32 * s ], p3: [ cx - w, mid ] } );
    curves.push( { p1: [ cx - w, mid ],   p2: [ cx - w * 0.95, bot + 0.22 * s ], p3: [ cx, bot ] } );
    // Right lobe
    curves.push( { p1: [ cx, bot ],       p2: [ cx + w * 0.95, bot + 0.22 * s ], p3: [ cx + w, mid ] } );
    curves.push( { p1: [ cx + w, mid ],   p2: [ cx + w * 0.55, top + 0.32 * s ], p3: [ cx, top ] } );

    return curves;

}


// =====================================================================
//  Pack Glyph Data into Float32 DataTextures
// =====================================================================

function packGlyphs( glyphCurves, texW = 512 ) {

    const texH = 4;
    const curveData = new Float32Array( texW * texH * 4 );
    const bandData  = new Float32Array( texW * texH * 4 );
    let cOff = 0, bOff = 0;
    const infos = [];

    for ( const curves of glyphCurves ) {

        const gx = bOff, gy = 0;

        // --- Write curve control points into curve texture ---
        const locs = curves.map( c => {

            const loc = [ cOff, 0 ];
            const i0 = cOff * 4;
            curveData[ i0     ] = c.p1[ 0 ];
            curveData[ i0 + 1 ] = c.p1[ 1 ];
            curveData[ i0 + 2 ] = c.p2[ 0 ];
            curveData[ i0 + 3 ] = c.p2[ 1 ];
            const i1 = ( cOff + 1 ) * 4;
            curveData[ i1     ] = c.p3[ 0 ];
            curveData[ i1 + 1 ] = c.p3[ 1 ];
            cOff += 2;
            return loc;

        } );

        const nC = curves.length;

        // --- Sort for horizontal bands (descending max-x) ---
        const hIdx = [ ...Array( nC ).keys() ].sort( ( a, b ) =>
            Math.max( curves[ b ].p1[ 0 ], curves[ b ].p2[ 0 ], curves[ b ].p3[ 0 ] ) -
            Math.max( curves[ a ].p1[ 0 ], curves[ a ].p2[ 0 ], curves[ a ].p3[ 0 ] )
        );

        // --- Sort for vertical bands (descending max-y) ---
        const vIdx = [ ...Array( nC ).keys() ].sort( ( a, b ) =>
            Math.max( curves[ b ].p1[ 1 ], curves[ b ].p2[ 1 ], curves[ b ].p3[ 1 ] ) -
            Math.max( curves[ a ].p1[ 1 ], curves[ a ].p2[ 1 ], curves[ a ].p3[ 1 ] )
        );

        // --- Band texture layout (1 hband + 1 vband) ---
        // Position 0 : hband header  (count, offset)
        // Position 1 : vband header  (count, offset)
        // Positions 2..2+nC-1       : hband curve list
        // Positions 2+nC..2+2*nC-1  : vband curve list

        const hListOff = 2;
        const vListOff = 2 + nC;

        // hband header
        const hi = ( gy * texW + gx ) * 4;
        bandData[ hi     ] = nC;
        bandData[ hi + 1 ] = hListOff;

        // vband header (at gx + bandMaxY + 1 = gx + 1 for single band)
        const vi = ( gy * texW + gx + 1 ) * 4;
        bandData[ vi     ] = nC;
        bandData[ vi + 1 ] = vListOff;

        // hband curve list
        hIdx.forEach( ( ci, j ) => {

            const idx = ( gy * texW + gx + hListOff + j ) * 4;
            bandData[ idx     ] = locs[ ci ][ 0 ];
            bandData[ idx + 1 ] = locs[ ci ][ 1 ];

        } );

        // vband curve list
        vIdx.forEach( ( ci, j ) => {

            const idx = ( gy * texW + gx + vListOff + j ) * 4;
            bandData[ idx     ] = locs[ ci ][ 0 ];
            bandData[ idx + 1 ] = locs[ ci ][ 1 ];

        } );

        bOff += 2 + 2 * nC;

        infos.push( {
            glyphData:      [ gx, gy, 0, 0 ],  // bandMaxX=0, bandMaxY=0 (single band)
            bandTransform:  [ 1, 1, 0, 0 ]
        } );

    }

    return { curveData, bandData, infos, texW, texH };

}


// =====================================================================
//  Scene Setup
// =====================================================================

const shapes = [
    {
        name: 'Circle',
        curves: circleContour( 0.5, 0.5, 0.42, 8 ),
        color: [ 0.30, 0.68, 0.95 ]
    },
    {
        name: 'Triangle',
        curves: polygonContour( [ [ 0.5, 0.88 ], [ 0.10, 0.12 ], [ 0.90, 0.12 ] ] ),
        color: [ 0.95, 0.50, 0.30 ]
    },
    {
        name: 'Star',
        curves: starContour( 0.5, 0.52, 0.44, 0.20, 5 ),
        color: [ 0.95, 0.85, 0.25 ]
    },
    {
        name: 'Heart',
        curves: heartContour( 0.5, 0.48, 1.0 ),
        color: [ 0.92, 0.30, 0.40 ]
    },
    {
        name: 'Ring',
        curves: [
            ...circleContour( 0.5, 0.5, 0.44, 8, false ),
            ...circleContour( 0.5, 0.5, 0.24, 8, true )
        ],
        color: [ 0.72, 0.42, 0.92 ]
    }
];

// Pack all glyph data into shared textures
const { curveData, bandData, infos, texW, texH } = packGlyphs( shapes.map( s => s.curves ) );

function makeDataTex( data, w, h ) {

    const tex = new THREE.DataTexture( data, w, h, THREE.RGBAFormat, THREE.FloatType );
    tex.magFilter      = THREE.NearestFilter;
    tex.minFilter      = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate    = true;
    return tex;

}

const curveTex = makeDataTex( curveData, texW, texH );
const bandTex  = makeDataTex( bandData,  texW, texH );

// --- Renderer ---
let renderer;
try {

    renderer = new THREE.WebGPURenderer( { antialias: true } );

} catch ( e ) {

    document.getElementById( 'error' ).style.display = 'flex';
    throw e;

}

renderer.setPixelRatio( window.devicePixelRatio );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.setClearColor( 0x0d0d1a );
document.body.appendChild( renderer.domElement );

// --- Scene & Camera ---
const scene  = new THREE.Scene();
const fSize  = 10;
const aspect = window.innerWidth / window.innerHeight;

const camera = new THREE.OrthographicCamera(
    - fSize * aspect / 2,   fSize * aspect / 2,
      fSize / 2,          - fSize / 2,
    0.1, 100
);
camera.position.set( 0, 0, 10 );

// --- Controls ---
const controls = new OrbitControls( camera, renderer.domElement );
controls.enableRotate      = false;
controls.enableDamping     = true;
controls.dampingFactor     = 0.12;
controls.screenSpacePanning = true;
controls.minZoom           = 0.1;
controls.maxZoom           = 200;

// --- Create glyph meshes ---
const spacing = 2.8;
const startX  = - spacing * ( shapes.length - 1 ) / 2;
const labels  = [];

shapes.forEach( ( shape, idx ) => {

    const info = infos[ idx ];
    const mat  = buildSlugMaterial( curveTex, bandTex, info.glyphData, info.bandTransform, shape.color );
    const geo  = new THREE.PlaneGeometry( 2.2, 2.2 );
    const mesh = new THREE.Mesh( geo, mat );
    mesh.position.x = startX + idx * spacing;
    scene.add( mesh );

    // Label
    const div = document.createElement( 'div' );
    div.className   = 'label';
    div.textContent = shape.name;
    document.body.appendChild( div );
    labels.push( { el: div, wx: mesh.position.x } );

} );

// --- Update label screen positions ---
const _v3 = new THREE.Vector3();

function updateLabels() {

    labels.forEach( l => {

        _v3.set( l.wx, - 1.5, 0 ).project( camera );
        const x = (   _v3.x * 0.5 + 0.5 ) * window.innerWidth;
        const y = ( - _v3.y * 0.5 + 0.5 ) * window.innerHeight;
        l.el.style.left = ( x - 50 ) + 'px';
        l.el.style.top  = y + 'px';

    } );

}

// --- Resize ---
window.addEventListener( 'resize', () => {

    const a = window.innerWidth / window.innerHeight;
    camera.left   = - fSize * a / 2;
    camera.right  =   fSize * a / 2;
    camera.top    =   fSize / 2;
    camera.bottom = - fSize / 2;
    camera.updateProjectionMatrix();
    renderer.setSize( window.innerWidth, window.innerHeight );

} );

// --- Render loop ---
renderer.setAnimationLoop( () => {

    controls.update();
    updateLabels();
    renderer.render( scene, camera );

} );

</script>
</body>
</html>
